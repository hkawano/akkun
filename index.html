<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuestLog — Family Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@500;700&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1330;
    --night: #211a3d;
    --panel: #f6f3ff;
    --gold: #ffb648;
    --gold-deep: #e8952c;
    --lime: #9be564;
    --coral: #ff6f6f;
    --sky: #6fc8ff;
    --line: rgba(27,19,48,0.12);
    --line-soft: rgba(255,255,255,0.14);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', 'Noto Sans Devanagari', system-ui, sans-serif;
    background:
      radial-gradient(1200px 500px at 15% -10%, #372a63 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #1a2a52 0%, transparent 55%),
      var(--night);
    color: var(--panel);
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: 'Baloo 2', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', 'Noto Sans Devanagari', system-ui, sans-serif; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: rgba(33,26,61,0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(155deg, var(--gold) 0%, var(--coral) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; transform: rotate(-6deg);
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    flex-shrink: 0;
  }
  .brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: 0.2px; }
  .brand p { margin: 0; font-size: 12px; color: #bcb3e0; }

  .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .lang-select {
    background: rgba(255,255,255,0.08); color: #e6e0ff; border: 1px solid var(--line-soft);
    border-radius: 999px; padding: 8px 12px; font-size: 12.5px; font-family: 'Inter'; font-weight: 600;
    cursor: pointer; appearance: none; -webkit-appearance: none;
  }
  .lang-select:focus-visible, button:focus-visible, .kid-chip:focus-visible, .stamp-chip:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

  .role-switch { display: flex; background: rgba(255,255,255,0.08); border-radius: 999px; padding: 3px; border: 1px solid var(--line-soft); }
  .role-switch button {
    border: none; background: transparent; color: #cfc7ec; font-family: inherit;
    font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .role-switch button.active { background: var(--gold); color: #2a1c00; }

  .lock-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-soft); background: rgba(255,255,255,0.08);
    color: #e6e0ff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px;
  }

  /* ---------- Layout ---------- */
  .shell { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; display: grid; grid-template-columns: 1fr; gap: 22px; }
  @media (min-width: 900px) { .shell { grid-template-columns: 1.55fr 1fr; align-items: start; } }

  .kid-picker { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 18px; }
  .kid-chip {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 7px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,0.06); border: 1px solid var(--line-soft); font-size: 13px; font-weight: 600; color: #d8d1f2;
  }
  .kid-chip.active { background: rgba(255,182,72,0.16); border-color: var(--gold); color: #ffdba0; }
  .kid-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; background: var(--lime); color: #14330a; flex-shrink: 0; }

  /* ---------- Stat strip ---------- */
  .stat-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-card { background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02)); border: 1px solid var(--line-soft); border-radius: 16px; padding: 14px 14px 12px; }
  .stat-card .num { font-family: 'Baloo 2', inherit; font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-card .lbl { font-size: 11.5px; color: #b6adda; margin-top: 4px; }
  .stat-card.xp .num { color: var(--gold); }
  .stat-card.streak .num { color: var(--coral); }
  .stat-card.badges .num { color: var(--sky); }

  /* ---------- Quest board ---------- */
  .badge-strip { display: flex; gap: 8px; flex-wrap: wrap; margin: -8px 0 18px; }
  .badge-chip {
    width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 19px; background: linear-gradient(160deg, rgba(255,182,72,0.22), rgba(255,182,72,0.06));
    border: 1px solid rgba(255,182,72,0.35); cursor: pointer; flex-shrink: 0;
  }
  .badge-chip.locked { background: rgba(255,255,255,0.04); border-color: var(--line-soft); opacity: 0.4; filter: grayscale(1); }
  .badge-empty-hint { font-size: 12px; color: #8f85b3; }

  .board-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
  .board-head h2 { margin: 0; font-size: 20px; }
  .add-btn { border: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 13px; background: var(--lime); color: #14330a; padding: 8px 14px; border-radius: 10px; }
  .columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 640px) { .columns { grid-template-columns: 1fr; } }
  .col { background: rgba(255,255,255,0.045); border: 1px solid var(--line-soft); border-radius: 16px; padding: 12px; min-height: 90px; }
  .col-title { font-size: 12.5px; font-weight: 700; color: #b6adda; margin: 2px 4px 10px; display: flex; justify-content: space-between; gap: 6px; }
  .col-title span.count { color: #82789f; font-weight: 600; }

  .task-card { background: var(--panel); color: var(--ink); border-radius: 14px; padding: 12px 12px 10px; margin-bottom: 10px; box-shadow: 0 3px 0 rgba(0,0,0,0.16); }
  .task-card:last-child { margin-bottom: 0; }
  .task-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .task-title { font-weight: 700; font-size: 14.5px; line-height: 1.25; }
  .task-meta { font-size: 11.5px; color: #6c6488; margin-top: 3px; }
  .xp-pill { flex-shrink: 0; background: #fff2da; color: var(--gold-deep); font-weight: 700; font-size: 11.5px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .task-actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { border: none; border-radius: 9px; font-family: inherit; font-weight: 700; font-size: 12.5px; padding: 7px 11px; cursor: pointer; }
  .btn-done { background: var(--night); color: #fff; }
  .btn-approve { background: var(--lime); color: #14330a; }
  .btn-reject { background: #ffe1e1; color: #a02323; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: #6c6488; }
  .status-note { font-size: 11.5px; margin-top: 8px; color: #8b3fd4; font-weight: 600; }
  .status-note.approved { color: #2f8a12; }
  .status-note.rejected { color: #c23434; }
  .empty-col { font-size: 12.5px; color: #6c6488; opacity: 0.6; padding: 10px 4px; }

  /* ---------- Chat panel ---------- */
  .chat-panel { background: rgba(255,255,255,0.045); border: 1px solid var(--line-soft); border-radius: 18px; display: flex; flex-direction: column; height: 560px; overflow: hidden; }
  .chat-head { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); display:flex; align-items:center; gap:8px; }
  .chat-head h2 { margin: 0; font-size: 16px; }
  .chat-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); flex-shrink: 0; }
  .chat-stream { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 84%; }
  .msg.me { align-self: flex-end; }
  .msg-bubble { background: rgba(255,255,255,0.09); border-radius: 13px 13px 13px 3px; padding: 8px 11px; font-size: 13.5px; line-height: 1.4; }
  .msg.me .msg-bubble { background: var(--gold); color: #2a1c00; border-radius: 13px 13px 3px 13px; }
  .msg-sender { font-size: 11px; color: #9d92c4; margin: 0 2px 3px; font-weight: 600; }
  .msg.me .msg-sender { text-align: right; }
  .msg-card { background: var(--panel); color: var(--ink); border-radius: 13px; padding: 10px 11px; font-size: 13px; border: 1px solid rgba(0,0,0,0.06); }
  .msg-card .mc-title { font-weight: 700; font-size: 13.5px; }
  .msg-card .mc-status { font-size: 11.5px; margin-top: 3px; font-weight: 600; color: #8b3fd4; }
  .msg-card .mc-status.approved { color: #2f8a12; }
  .msg-card .mc-status.rejected { color: #c23434; }
  .msg-stamp .msg-bubble { font-weight: 700; }
  .msg-voice .msg-bubble { display: flex; align-items: center; gap: 8px; }

  .chat-input-area { border-top: 1px solid var(--line-soft); padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .stamp-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
  .stamp-chip { flex-shrink: 0; border: 1px solid var(--line-soft); background: rgba(255,255,255,0.06); color: #e6e0ff; border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .stamp-chip:active { background: var(--gold); color: #2a1c00; }
  .compose-row { display: flex; gap: 7px; align-items: center; }
  .compose-row input[type=text] { flex: 1; border: 1px solid var(--line-soft); background: rgba(255,255,255,0.07); color: #fff; border-radius: 999px; padding: 10px 14px; font-size: 13.5px; font-family: inherit; min-width: 0; }
  .compose-row input::placeholder { color: #8f85b3; }
  .round-btn { width: 38px; height: 38px; border-radius: 50%; border: none; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .round-btn.send { background: var(--gold); color: #2a1c00; }
  .round-btn.voice { background: rgba(255,255,255,0.08); color: #e6e0ff; border: 1px solid var(--line-soft); }
  .round-btn.voice.recording { background: var(--coral); color: #fff; }

  /* ---------- Modal ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(10,7,24,0.6); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--panel); color: var(--ink); border-radius: 18px; padding: 20px; width: 100%; max-width: 380px; }
  .modal h3 { margin: 0 0 14px; font-size: 18px; }
  .modal p.hint { font-size: 12.5px; color: #6c6488; margin: -8px 0 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #6c6488; margin-bottom: 5px; }
  .field input[type=text], .field input[type=password], .field input[type=tel], .field select { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); font-size: 14px; font-family: inherit; letter-spacing: 0.5px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  .pin-error { font-size: 12.5px; color: #c23434; font-weight: 600; margin: -6px 0 10px; min-height: 1em; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--night); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 60; border: 1px solid var(--line-soft); max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 8px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">🗺️</div>
    <div>
      <h1>QuestLog</h1>
      <p id="brandSubtitle">Family task board</p>
    </div>
  </div>
  <div class="topbar-right">
    <select class="lang-select" id="langSelect" aria-label="Language"></select>
    <div class="role-switch" id="roleSwitch">
      <button data-role="child" id="roleChildBtn"></button>
      <button data-role="parent" id="roleParentBtn"></button>
    </div>
    <button class="lock-btn" id="lockBtn" title="Lock parent mode" style="display:none;">🔒</button>
  </div>
</div>

<div class="shell">
  <div>
    <div class="kid-picker" id="kidPicker"></div>

    <div class="stat-strip">
      <div class="stat-card xp"><div class="num" id="statXp">0</div><div class="lbl" id="statXpLbl"></div></div>
      <div class="stat-card streak"><div class="num" id="statStreak">0</div><div class="lbl" id="statStreakLbl"></div></div>
      <div class="stat-card badges" id="statBadgesCard" role="button" tabindex="0" style="cursor:pointer;"><div class="num" id="statBadges">0</div><div class="lbl" id="statBadgesLbl"></div></div>
    </div>

    <div class="badge-strip" id="badgeStrip"></div>

    <div class="board-head">
      <h2 id="questBoardHeading"></h2>
      <div style="display:flex; gap:8px; flex-wrap: wrap;">
        <button class="add-btn manage-btn" id="manageBadgesBtn" style="display:none; background:rgba(255,255,255,0.12); color:#e6e0ff;"></button>
        <button class="add-btn manage-btn" id="manageKidsBtn" style="display:none; background:rgba(255,255,255,0.12); color:#e6e0ff;"></button>
        <button class="add-btn" id="addTaskBtn"></button>
      </div>
    </div>
    <div class="columns">
      <div class="col"><div class="col-title"><span id="colAssignedLbl"></span> <span class="count" id="cnt-assigned">0</span></div><div id="col-assigned"></div></div>
      <div class="col"><div class="col-title"><span id="colPendingLbl"></span> <span class="count" id="cnt-pending">0</span></div><div id="col-pending"></div></div>
      <div class="col"><div class="col-title"><span id="colDoneLbl"></span> <span class="count" id="cnt-done">0</span></div><div id="col-done"></div></div>
    </div>
  </div>

  <div class="chat-panel">
    <div class="chat-head"><span class="dot"></span><h2 id="familyChatHeading"></h2></div>
    <div class="chat-stream" id="chatStream"></div>
    <div class="chat-input-area">
      <div class="stamp-row" id="stampRow"></div>
      <div class="compose-row">
        <button class="round-btn voice" id="voiceBtn" title="Voice clip">🎤</button>
        <input type="text" id="chatInput" maxlength="200">
        <button class="round-btn send" id="sendBtn" title="Send">➤</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="taskModalBg">
  <div class="modal">
    <h3 id="modalNewQuestTitle"></h3>
    <div class="field">
      <label id="fieldTitleLbl"></label>
      <input type="text" id="newTaskTitle" maxlength="60">
    </div>
    <div class="field-row">
      <div class="field">
        <label id="fieldAssignLbl"></label>
        <select id="newTaskKid"></select>
      </div>
      <div class="field">
        <label id="fieldXpLbl"></label>
        <select id="newTaskXp">
          <option value="10" id="xpQuickOpt"></option>
          <option value="20" selected id="xpNormalOpt"></option>
          <option value="35" id="xpBigOpt"></option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelTaskBtn"></button>
      <button class="btn btn-approve" id="createTaskBtn"></button>
    </div>
  </div>
</div>

<div class="modal-bg" id="badgesViewModalBg">
  <div class="modal" style="max-width:420px;">
    <h3 id="badgesViewTitle"></h3>
    <p class="hint" id="badgesViewHint"></p>
    <div id="badgesViewList" style="display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="closeBadgesViewBtn"></button>
    </div>
  </div>
</div>

<div class="modal-bg" id="manageBadgesModalBg">
  <div class="modal" style="max-width:440px;">
    <h3 id="manageBadgesTitle"></h3>
    <p class="hint" id="manageBadgesHint"></p>
    <div id="badgesListWrap" style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px; max-height:260px; overflow-y:auto;"></div>
    <div style="border-top:1px solid var(--line); padding-top:14px;">
      <div class="field-row">
        <div class="field" style="flex:0 0 56px;">
          <label id="newBadgeEmojiLbl"></label>
          <input type="text" id="newBadgeEmoji" maxlength="4" placeholder="🏅" style="text-align:center;">
        </div>
        <div class="field" style="flex:1;">
          <label id="newBadgeNameLbl"></label>
          <input type="text" id="newBadgeName" maxlength="24">
        </div>
        <div class="field" style="flex:0 0 84px;">
          <label id="newBadgeXpLbl"></label>
          <input type="text" inputmode="numeric" id="newBadgeXp" maxlength="5" placeholder="100">
        </div>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button class="btn btn-approve" id="addBadgeBtn"></button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="closeManageBadgesBtn"></button>
    </div>
  </div>
</div>

<div class="modal-bg" id="kidsModalBg">
  <div class="modal" style="max-width:420px;">
    <h3 id="manageKidsTitle"></h3>
    <p class="hint" id="manageKidsHint"></p>
    <div id="kidsListWrap" style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px; max-height:260px; overflow-y:auto;"></div>
    <div style="border-top:1px solid var(--line); padding-top:14px;">
      <div class="field-row">
        <div class="field" style="flex:0 0 64px;">
          <label id="newKidEmojiLbl"></label>
          <input type="text" id="newKidEmoji" maxlength="4" placeholder="🧒" style="text-align:center;">
        </div>
        <div class="field" style="flex:1;">
          <label id="newKidNameLbl"></label>
          <input type="text" id="newKidName" maxlength="24">
        </div>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button class="btn btn-approve" id="addKidBtn"></button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="closeKidsModalBtn"></button>
    </div>
  </div>
</div>

<div class="modal-bg" id="pinModalBg">
  <div class="modal">
    <h3 id="pinModalTitle"></h3>
    <p class="hint" id="pinModalHint"></p>
    <div class="field">
      <label id="pinFieldLbl"></label>
      <input type="password" inputmode="numeric" pattern="[0-9]*" id="pinInput" maxlength="6" placeholder="••••">
    </div>
    <div class="pin-error" id="pinError"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="pinCancelBtn"></button>
      <button class="btn btn-approve" id="pinSubmitBtn"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  // ---- Firebase setup (used when this file runs outside Claude, e.g. on GitHub Pages) ----
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import {
    getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB7Wl9rmyf_sHjfm78-NMH9v_3jdiLEWLY",
    authDomain: "questlog-family.firebaseapp.com",
    projectId: "questlog-family",
    storageBucket: "questlog-family.firebasestorage.app",
    messagingSenderId: "387818452437",
    appId: "1:387818452437:web:b367b8e32f960d3424395c"
  };

  window.__firebaseDbPromise = (async () => {
    try {
      const app = initializeApp(firebaseConfig);
      const firestore = getFirestore(app);

      // Wraps the Firestore modular SDK behind the same tiny interface the app
      // already speaks to Claude's artifact "db" capability, so the rest of
      // the app's code needs zero changes.
      return {
        collection(path) {
          return {
            onSnapshot(cb) {
              return onSnapshot(collection(firestore, path), (snap) => {
                cb(snap.docs.map(d => ({ id: d.id, data: () => d.data() })));

            add(data) { return addDoc(collection(firestore, path), data); }
          };

          const ref = doc(firestore, path);
          return {
            set(data) { return setDoc(ref, data); },
            update(data) { return updateDoc(ref, data); },
            delete() { return deleteDoc(ref); },
            onSnapshot(cb) {
              return onSnapshot(ref, (snap) => { cb({ id: snap.id, data: () => snap.data() }); });
            }
          };
        }
      };
    } catch (e) {
      console.error("Firebase init failed", e);

    { id: "kid_yuki", name: "Yuki", emoji: "🦊", order: 0 },
    { id: "kid_sora", name: "Sora", emoji: "🐼", order: 1 }
  ];
  const DEFAULT_BADGES = [
    { name: "Starter", emoji: "🌱", xp: 50 },
    { name: "Bronze", emoji: "🥉", xp: 150 },
    { name: "Silver", emoji: "🥈", xp: 300 },
    { name: "Gold", emoji: "🥇", xp: 500 },
    { name: "Champion", emoji: "🏆", xp: 800 }
  ];

  let db = null;
  let role = "child";
  let activeKid = null;
  let tasksCache = {};
  let messagesCache = {};
  let statsCache = {};
  let kidsCache = {};         // live from db.collection("kids")
  let badgesCache = {};       // live from db.collection("badges")
  let removePendingId = null; // two-tap confirm state for removing a kid
  let removePendingBadgeId = null;
  let parentPin = null;       // stored PIN from settings doc (null = not set yet)
  let parentUnlocked = false; // unlocked for this session only
  let pinMode = "enter";      // "enter" | "set"

  function kidsList() {
    return Object.entries(kidsCache)
      .map(([id, k]) => ({ id, ...k }))
      .sort((a, b) => (a.order || 0) - (b.order || 0) || (a.createdAt || 0) - (b.createdAt || 0));
  }

  function badgesList() {
    return Object.entries(badgesCache)
      .map(([id, b]) => ({ id, ...b }))
      .sort((a, b) => (a.xp || 0) - (b.xp || 0));
  }

  // ================= helpers =================
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(() => el.classList.remove("show"), 1800);
  }
  function kidById(id) {
    if (kidsCache[id]) return { id, ...kidsCache[id] };
    const list = kidsList();
    return list[0] || { id: id || "kid_unknown", name: "?", emoji: "🧒" };
  }
  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function timeStr(ts) {
    try { return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return ""; }
  }

  // ================= language switching =================
  function populateLangSelect() {
    const sel = document.getElementById("langSelect");
    sel.innerHTML = LANG_ORDER.map(code => `<option value="${code}">${LANGS[code].name}</option>`).join("");
    sel.value = lang;
  }
  function setLang(code) {
    if (!LANGS[code]) return;
    lang = code;
    try { localStorage.setItem("questlog_lang", lang); } catch (e) { /* ignore */ }
    document.documentElement.lang = code === "zh-CN" ? "zh-CN" : code;
    applyStaticText();
    renderKidPicker();
    renderTasks();
    renderStats();
    renderChat();
    renderStampRow();
  }

    document.getElementById("roleChildBtn").textContent = t("kidMode");
    document.getElementById("roleParentBtn").textContent = t("parentMode");

    document.getElementById("statStreakLbl").textContent = t("statStreak");

    document.getElementById("fieldXpLbl").textContent = t("fieldXp");
    document.getElementById("xpQuickOpt").textContent = t("xpQuick");
    document.getElementById("xpNormalOpt").textContent = t("xpNormal");
    document.getElementById("xpBigOpt").textContent = t("xpBig");
    document.getElementById("cancelTaskBtn").textContent = t("cancel");
    document.getElementById("createTaskBtn").textContent = t("createQuest");
    document.getElementById("pinFieldLbl").textContent = t("pinFieldLbl");
    document.getElementById("pinCancelBtn").textContent = t("cancel");

    document.getElementById("colDoneLbl").textContent = t("colDone");
    document.getElementById("manageKidsBtn").textContent = t("manageKidsBtn");
    document.getElementById("manageKidsTitle").textContent = t("manageKidsTitle");
    document.getElementById("manageKidsHint").textContent = t("manageKidsHint");

    document.getElementById("badgesViewTitle").textContent = t("statBadges");

    document.getElementById("closeBadgesViewBtn").textContent = t("cancel");
    document.getElementById("manageBadgesBtn").textContent = t("manageBadgesBtn");
    document.getElementById("manageBadgesTitle").textContent = t("manageBadgesTitle");
    document.getElementById("manageBadgesHint").textContent = t("manageBadgesHint");
    document.getElementById("newBadgeEmojiLbl").textContent = t("newKidEmojiLbl");
    document.getElementById("newBadgeNameLbl").textContent = t("newKidNameLbl");

    document.getElementById("closeManageBadgesBtn").textContent = t("cancel");

    if (kidSel && kidSel.options.length) {

      Array.from(kidSel.options).forEach((opt, i) => { if (list[i]) opt.textContent = `${list[i].emoji} ${list[i].name}`; });
    }
  }

  // ================= role & kid picker =================
  function setRole(r) {
    if (r === "parent" && !parentUnlocked) {
      openPinModal("enter");
      return;
    }
    role = r;
    document.getElementById("roleChildBtn").classList.toggle("active", r === "child");
    document.getElementById("roleParentBtn").classList.toggle("active", r === "parent");
    document.getElementById("addTaskBtn").style.display = r === "parent" ? "inline-block" : "none";
    document.getElementById("manageKidsBtn").style.display = r === "parent" ? "inline-block" : "none";
    document.getElementById("manageBadgesBtn").style.display = r === "parent" ? "inline-block" : "none";
    document.getElementById("lockBtn").style.display = r === "parent" ? "flex" : "none";
    if (r === "child") parentUnlocked = false;
    renderKidPicker();
    renderTasks();
    renderStats();
    renderChat();
  }

  function lockParentMode() {
    parentUnlocked = false;
    setRole("child");
    toast(t("unlock") === "Unlock" ? "Locked" : t("unlock"));
  }

  function renderKidPicker() {
    const el = document.getElementById("kidPicker");
    el.innerHTML = "";
    const list = kidsList();
    if (!list.length) return;
    if (!activeKid || !kidsCache[activeKid]) activeKid = list[0].id;
    list.forEach(k => {
      if (role === "child" && k.id !== activeKid) return;
      const chip = document.createElement("div");
      chip.className = "kid-chip" + (k.id === activeKid ? " active" : "");
      chip.tabIndex = 0;
      chip.innerHTML = `<span class="kid-avatar">${k.emoji}</span> ${escapeHtml(k.name)}`;
      chip.onclick = () => { activeKid = k.id; renderKidPicker(); renderTasks(); renderStats(); };
      el.appendChild(chip);
    });
  }

  // ================= stats & badges =================
  function unlockedBadges(xp) { return badgesList().filter(b => xp >= (b.xp || 0)); }

  function renderStats() {
    const s = statsCache[activeKid] || { xp: 0, streak: 0 };
    document.getElementById("statXp").textContent = s.xp || 0;
    document.getElementById("statStreak").textContent = s.streak || 0;
    const total = badgesList().length;
    document.getElementById("statBadges").textContent = total ? `${unlockedBadges(s.xp || 0).length}/${total}` : "0";
    renderBadgeStrip(s.xp || 0);
  }

  function renderBadgeStrip(xp) {
    const wrap = document.getElementById("badgeStrip");
    const list = badgesList();
    wrap.innerHTML = "";
    if (!list.length) return;
    list.forEach(b => {
      const chip = document.createElement("div");
      const isUnlocked = xp >= (b.xp || 0);
      chip.className = "badge-chip" + (isUnlocked ? "" : " locked");
      chip.textContent = b.emoji;
      chip.title = isUnlocked ? b.name : `${b.name} — ${t("xpToGo", { n: Math.max(0, (b.xp || 0) - xp) })}`;
      chip.onclick = openBadgesViewModal;
      wrap.appendChild(chip);
    });
  }

  async function bumpStats(kidId, xpDelta) {
    if (!db) return;
    try {
      const docId = "stats_" + kidId;
      const existing = statsCache[kidId] || { xp: 0, streak: 0 };
      const oldXp = existing.xp || 0;
      const newXp = Math.max(0, oldXp + xpDelta);
      await db.doc("stats/" + docId).set({ xp: newXp, streak: existing.streak || 0, updatedAt: Date.now() });
      if (xpDelta > 0) {
        const newlyUnlocked = badgesList().filter(b => oldXp < (b.xp || 0) && newXp >= (b.xp || 0));
        for (const b of newlyUnlocked) { await celebrateBadge(kidId, b); }
      }
    } catch (e) { console.error("stats write failed", e); }
  }

  async function celebrateBadge(kidId, badge) {
    toast(badge.emoji + " " + t("toastBadgeUnlocked", { name: badge.name }));
    if (!db) return;
    try {
      await db.collection("messages").add({
        type: "badge_unlock", badgeName: badge.name, badgeEmoji: badge.emoji,
        sender: kidById(kidId).name, senderRole: "child", ts: Date.now()
      });
    } catch (e) { console.error("badge card post failed", e); }
  }

  // ================= tasks =================
  function tasksForKid(kidId) {
    return Object.entries(tasksCache).map(([id, tk]) => ({ id, ...tk }))
      .filter(tk => tk.assignedTo === kidId)
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  }

  function renderTasks() {
    if (!activeKid) { return; }
    const list = tasksForKid(activeKid);
    const cols = { assigned: [], pending: [], done: [] };
    list.forEach(tk => {
      if (tk.status === "approved" || tk.status === "rejected") cols.done.push(tk);
      else if (tk.status === "pending") cols.pending.push(tk);
      else cols.assigned.push(tk);
    });
    const emptyKeys = { assigned: "emptyAssigned", pending: "emptyPending", done: "emptyDone" };
    Object.keys(cols).forEach(key => {
      const container = document.getElementById("col-" + key);
      document.getElementById("cnt-" + key).textContent = cols[key].length;
      container.innerHTML = "";
      if (cols[key].length === 0) {
        container.innerHTML = `<div class="empty-col">${escapeHtml(t(emptyKeys[key]))}</div>`;
        return;
      }
      cols[key].forEach(tk => container.appendChild(renderTaskCard(tk)));
    });
  }

  function renderTaskCard(tk) {
    const card = document.createElement("div");
    card.className = "task-card";
    const kid = kidById(tk.assignedTo);
    let actionsHtml = "", noteHtml = "";

    if (tk.status === "assigned" && role === "child") {
      actionsHtml = `<div class="task-actions"><button class="btn btn-done" data-act="submit" data-id="${tk.id}">${escapeHtml(t("markDone"))}</button></div>`;
    } else if (tk.status === "assigned" && role === "parent") {
      noteHtml = `<div class="status-note">${escapeHtml(t("waitingFor", { name: kid.name }))}</div>`;
    } else if (tk.status === "pending" && role === "parent") {
      actionsHtml = `<div class="task-actions">
          <button class="btn btn-approve" data-act="approve" data-id="${tk.id}">${escapeHtml(t("approveBtn"))}</button>
          <button class="btn btn-reject" data-act="reject" data-id="${tk.id}">${escapeHtml(t("sendBackBtn"))}</button>
        </div>`;
    } else if (tk.status === "pending" && role === "child") {
      noteHtml = `<div class="status-note">${escapeHtml(t("waitingReview"))}</div>`;
    } else if (tk.status === "approved") {
      noteHtml = `<div class="status-note approved">${escapeHtml(t("approvedNote", { xp: tk.xp }))}</div>`;
    } else if (tk.status === "rejected") {
      noteHtml = `<div class="status-note rejected">${escapeHtml(t("sentBackNote"))}</div>
        <div class="task-actions"><button class="btn btn-ghost" data-act="reassign" data-id="${tk.id}">${escapeHtml(t("reassignBtn"))}</button></div>`;
    }

    card.innerHTML = `
      <div class="task-top">
        <div class="task-title">${escapeHtml(tk.title)}</div>
        <div class="xp-pill">${tk.xp} XP</div>
      </div>
      <div class="task-meta">${escapeHtml(kid.name)}</div>
      ${noteHtml}
      ${actionsHtml}
    `;
    card.querySelectorAll("button[data-act]").forEach(btn => {
      btn.addEventListener("click", () => handleTaskAction(btn.dataset.act, btn.dataset.id));
    });
    return card;
  }

  async function handleTaskAction(act, taskId) {
    if (!db) { toast(t("toastNotConnected")); return; }
    const tk = tasksCache[taskId];
    if (!tk) return;
    try {
      if (act === "submit") {
        await db.doc("tasks/" + taskId).update({ status: "pending", submittedAt: Date.now() });
        await postSystemCard(taskId, "submitted");
        toast(t("toastSentReview"));
      } else if (act === "approve") {
        await db.doc("tasks/" + taskId).update({ status: "approved", reviewedAt: Date.now() });
        await bumpStats(tk.assignedTo, tk.xp || 0);
        await postSystemCard(taskId, "approved");
        toast(t("toastApproved"));
      } else if (act === "reject") {
        await db.doc("tasks/" + taskId).update({ status: "rejected", reviewedAt: Date.now() });
        await postSystemCard(taskId, "rejected");
        toast(t("toastSentBack"));
      } else if (act === "reassign") {
        await db.doc("tasks/" + taskId).update({ status: "assigned" });
      }
    } catch (e) {
      console.error(e);
      toast(t("toastConflict"));
    }
  }

  async function postSystemCard(taskId, kind) {
    if (!db) return;
    const tk = tasksCache[taskId];
    if (!tk) return;
    try {
      await db.collection("messages").add({
        type: "task_card", taskId: taskId, taskTitle: tk.title,
        status: kind === "submitted" ? "pending" : kind,
        sender: role === "parent" ? t("parentMode") : kidById(tk.assignedTo).name,
        senderRole: role, ts: Date.now()
      });
    } catch (e) { console.error("card post failed", e); }
  }

  function openTaskModal() {
    const sel = document.getElementById("newTaskKid");
    sel.innerHTML = kidsList().map(k => `<option value="${k.id}">${k.emoji} ${escapeHtml(k.name)}</option>`).join("");

      wrap.innerHTML = `<div class="empty-col" style="color:#6c6488;">${escapeHtml(t("badgesNone"))}</div>`;
      return;

      row.innerHTML = `

            <div class="hi-title">${escapeHtml(b.name)}</div>
            <div class="hi-date">${isUnlocked ? escapeHtml(t("badgeUnlockedLbl")) : escapeHtml(t("xpToGo", { n: Math.max(0, (b.xp || 0) - xp) }))}</div>
          </div>
        </div>
        <div class="hi-right"><div class="hi-xp">${b.xp || 0} XP</div></div>`;
      wrap.appendChild(row);
    });

    const wrap = document.getElementById("badgesListWrap");
    wrap.innerHTML = "";
    badgesList().forEach(b => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex; gap:6px; align-items:center; background:rgba(0,0,0,0.03); border-radius:10px; padding:6px;";

        <input type="text" data-role="name" value="${escapeHtml(b.name)}" maxlength="24"
          style="flex:1; min-width:0; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px;">
        <input type="text" inputmode="numeric" data-role="xp" value="${b.xp || 0}" maxlength="5"
          style="width:64px; text-align:center; border:1px solid var(--line); border-radius:8px; padding:8px 4px; font-size:14px;">
        <button class="btn btn-approve" data-role="save" style="flex-shrink:0;">${escapeHtml(t("saveBtn"))}</button>
        <button class="btn btn-reject" data-role="remove" style="flex-shrink:0;">${escapeHtml(removePendingBadgeId === b.id ? t("removeConfirmBtn") : t("removeBtn"))}</button>
      `;
      row.querySelector('[data-role="save"]').addEventListener("click", () => {
        const name = row.querySelector('[data-role="name"]').value.trim();
        const emoji = row.querySelector('[data-role="emoji"]').value.trim() || "🏅";
        const xp = parseInt(row.querySelector('[data-role="xp"]').value, 10);
        saveBadge(b.id, name, emoji, xp);
      });
      row.querySelector('[data-role="remove"]').addEventListener("click", () => handleRemoveBadgeClick(b.id));
      wrap.appendChild(row);
    });
  }

  async function saveBadge(id, name, emoji, xp) {
    if (!name) { toast(t("toastBadgeNameRequired")); return; }
    if (!Number.isFinite(xp) || xp < 0) { toast(t("toastBadgeXpInvalid")); return; }
    if (!db) { toast(t("toastNotConnected")); return; }
    try {
      await db.doc("badges/" + id).update({ name, emoji, xp });
      toast(t("toastBadgeSaved"));
    } catch (e) { console.error(e); toast(t("toastConflict")); }
  }

  async function addBadge() {
    const name = document.getElementById("newBadgeName").value.trim();
    const emoji = document.getElementById("newBadgeEmoji").value.trim() || "🏅";
    const xp = parseInt(document.getElementById("newBadgeXp").value, 10);
    if (!name) { toast(t("toastBadgeNameRequired")); return; }
    if (!Number.isFinite(xp) || xp < 0) { toast(t("toastBadgeXpInvalid")); return; }
    if (!db) { toast(t("toastNotConnected")); return; }
    try {
      await db.collection("badges").add({ name, emoji, xp, createdAt: Date.now() });
      document.getElementById("newBadgeName").value = "";
      document.getElementById("newBadgeEmoji").value = "";
      document.getElementById("newBadgeXp").value = "";
      toast(t("toastBadgeAdded"));
    } catch (e) { console.error(e); toast(t("toastCouldntAdd")); }
  }

  function handleRemoveBadgeClick(id) {
    if (removePendingBadgeId === id) {
      removeBadge(id);
    } else {
      removePendingBadgeId = id;
      renderManageBadgesList();
    }
  }

  async function removeBadge(id) {
    if (!db) { toast(t("toastNotConnected")); return; }
    try {
      await db.doc("badges/" + id).delete();
      removePendingBadgeId = null;
      toast(t("toastKidRemoved"));
      renderManageBadgesList();
    } catch (e) { console.error(e); toast(t("toastConflict")); }
  }

  async function saveKid(id, name, emoji) {
    if (!name) { toast(t("toastKidNameRequired")); return; }
    if (!db) { toast(t("toastNotConnected")); return; }
    try {
      const existing = kidsCache[id] || {};
      await db.doc("kids/" + id).update({ name, emoji, order: existing.order || 0 });
      toast(t("toastKidSaved"));
    } catch (e) { console.error(e); toast(t("toastConflict")); }
  }

  async function addKid() {
    const name = document.getElementById("newKidName").value.trim();
    const emoji = document.getElementById("newKidEmoji").value.trim() || "🧒";
    if (!name) { toast(t("toastKidNameRequired")); return; }
    if (!db) { toast(t("toastNotConnected")); return; }
    try {
      const nextOrder = kidsList().length;
      await db.collection("kids").add({ name, emoji, order: nextOrder, createdAt: Date.now() });
      document.getElementById("newKidName").value = "";
      document.getElementById("newKidEmoji").value = "";
      toast(t("toastKidAdded"));
    } catch (e) { console.error(e); toast(t("toastCouldntAdd")); }
  }

  function handleRemoveKidClick(id) {
    if (kidsList().length <= 1) { toast(t("toastKidsMin")); return; }
    if (removePendingId === id) {
      removeKid(id);
    } else {
      removePendingId = id;
      renderKidsModalList();
    }
  }

  async function removeKid(id) {
    if (!db) { toast(t("toastNotConnected")); return; }
    try {
      await db.doc("kids/" + id).delete();
      removePendingId = null;
      if (activeKid === id) activeKid = null;
      toast(t("toastKidRemoved"));
      renderKidsModalList();
    } catch (e) { console.error(e); toast(t("toastConflict")); }
  }

  // ================= PIN gate =================
  function openPinModal(mode) {
    pinMode = mode; // "enter" or "set"
    document.getElementById("pinModalTitle").textContent = mode === "set" ? t("pinSetTitle") : t("pinEnterTitle");
    document.getElementById("pinModalHint").textContent = mode === "set" ? t("pinCreateHint") : t("pinEnterHint");
    document.getElementById("pinSubmitBtn").textContent = mode === "set" ? t("setPin") : t("unlock");
    document.getElementById("pinInput").value = "";
    document.getElementById("pinError").textContent = "";
    document.getElementById("pinModalBg").classList.add("open");
    setTimeout(() => document.getElementById("pinInput").focus(), 50);
  }
  function closePinModal() { document.getElementById("pinModalBg").classList.remove("open"); }

  async function submitPin() {
    const val = document.getElementById("pinInput").value.trim();
    const errEl = document.getElementById("pinError");
    if (!/^\d{4,6}$/.test(val)) { errEl.textContent = t("pinTooShort"); return; }

    if (pinMode === "set") {
      if (!db) { toast(t("toastNotConnected")); return; }
      try {
        await db.doc("settings/main").set({ parentPin: val, updatedAt: Date.now() });
        parentPin = val;
        parentUnlocked = true;
        closePinModal();
        setRole("parent");
      } catch (e) {
        console.error(e);
        errEl.textContent = t("toastConflict");
      }
    } else {
      if (val === parentPin) {
        parentUnlocked = true;
        closePinModal();
        setRole("parent");
      } else {
        errEl.textContent = t("pinIncorrect");
        document.getElementById("pinInput").value = "";
        document.getElementById("pinInput").focus();
      }
    }
  }

  // ================= chat =================
  function renderStampRow() {
    const row = document.getElementById("stampRow");
    row.innerHTML = "";
    tStamps().forEach(s => {
      const chip = document.createElement("button");
      chip.className = "stamp-chip";
      chip.textContent = s;
      chip.onclick = () => sendMessage({ type: "stamp", content: s });
      row.appendChild(chip);
    });
  }

  function renderChat() {
    const stream = document.getElementById("chatStream");
    const atBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 60;
    const msgs = Object.entries(messagesCache).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    stream.innerHTML = "";
    if (msgs.length === 0) {
      stream.innerHTML = `<div class="empty-col">${escapeHtml(t("emptyChat"))}</div>`;
      return;
    }
    const myName = role === "parent" ? t("parentMode") : kidById(activeKid).name;
    msgs.forEach(m => stream.appendChild(renderMessage(m, m.sender === myName)));
    if (atBottom) stream.scrollTop = stream.scrollHeight;
  }

  function renderMessage(m, isMe) {
    const wrap = document.createElement("div");
    wrap.className = "msg" + (isMe ? " me" : "");
    if (m.type === "badge_unlock") {
      wrap.innerHTML = `
        <div class="msg-sender">${escapeHtml(m.sender)} · ${timeStr(m.ts)}</div>
        <div class="msg-card" style="text-align:center;">
          <div style="font-size:26px; line-height:1;">${escapeHtml(m.badgeEmoji)}</div>
          <div class="mc-title" style="margin-top:4px;">${escapeHtml(t("badgeUnlockedNote", { name: m.badgeName }))}</div>
        </div>`;
    } else if (m.type === "task_card") {
      const statusLabel = m.status === "pending" ? t("cardSentReview") : m.status === "approved" ? t("cardApproved") : t("cardSentBack");
      wrap.innerHTML = `
        <div class="msg-sender">${escapeHtml(m.sender)} · ${timeStr(m.ts)}</div>
        <div class="msg-card">
          <div class="mc-title">🗒️ ${escapeHtml(m.taskTitle)}</div>
          <div class="mc-status ${m.status}">${escapeHtml(statusLabel)}</div>
        </div>`;
    } else if (m.type === "voice") {
      wrap.classList.add("msg-voice");
      wrap.innerHTML = `
        <div class="msg-sender">${escapeHtml(m.sender)} · ${timeStr(m.ts)}</div>
        <div class="msg-bubble">🎤 <span>${escapeHtml(t("voiceClip", { n: m.durationSec || 0 }))}</span></div>`;
    } else if (m.type === "stamp") {
      wrap.classList.add("msg-stamp");
      wrap.innerHTML = `
        <div class="msg-sender">${escapeHtml(m.sender)} · ${timeStr(m.ts)}</div>
        <div class="msg-bubble">${escapeHtml(m.content)}</div>`;
    } else {
      wrap.innerHTML = `
        <div class="msg-sender">${escapeHtml(m.sender)} · ${timeStr(m.ts)}</div>
        <div class="msg-bubble">${escapeHtml(m.content)}</div>`;
    }
    return wrap;
  }

  async function sendMessage({ type, content, durationSec }) {
    if (!db) { toast(t("toastNotConnected")); return; }
    const sender = role === "parent" ? t("parentMode") : kidById(activeKid).name;
    try {
      await db.collection("messages").add({ type, content: content || "", sender, senderRole: role, durationSec: durationSec || 0, ts: Date.now() });
    } catch (e) {
      console.error(e);
      toast(t("toastMsgFail"));
    }
  }

  function handleSend() {
    const input = document.getElementById("chatInput");
    const val = input.value.trim();
    if (!val) return;
    sendMessage({ type: "text", content: val });
    input.value = "";
  }

  let recording = false;
  function toggleVoice() {
    const btn = document.getElementById("voiceBtn");
    if (!recording) {
      recording = true;
      btn.classList.add("recording");
      btn.textContent = "●";
      toast(t("toastRecording"));
    } else {
      recording = false;
      btn.classList.remove("recording");
      btn.textContent = "🎤";
      const dur = 2 + Math.floor(Math.random() * 8);
      sendMessage({ type: "voice", durationSec: dur });
    }
  }

  // ================= db wiring =================
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function connectDb() {
    // The Firebase module script (standalone/GitHub Pages) and window.claude
    // (Claude artifact) can both appear after this script's first run — the
    // Firebase <script type="module"> in particular is deferred and may not
    // have executed yet. Poll briefly for whichever shows up rather than
    // checking once and giving up.
    const deadline = Date.now() + 9000;
    while (!window.__firebaseDbPromise && !(window.claude && typeof window.claude.use === "function")) {
      if (Date.now() > deadline) return null;
      await sleep(100);
    }
    if (window.__firebaseDbPromise) {
      try {
        const handle = await window.__firebaseDbPromise;
        if (handle) return handle;
      } catch (e) { console.error("Firebase connect failed", e); }
    }
    if (window.claude && typeof window.claude.use === "function") {
      try {
        const handle = await window.claude.use("db");
        return handle || null;
      } catch (e) {
        console.error("db capability failed to load", e);
        return null;
      }
    }
    return null;
  }

  async function init() {
    populateLangSelect();
    applyStaticText();
    setRole("child");
    renderStampRow();
    renderTasks();
    renderChat();
    renderStats();

    db = await connectDb();
    if (!db) { toast(t("toastNoSave")); return; }

    try {
      db.collection("kids").onSnapshot((snap) => {
        kidsCache = {};
        (snap.docs || snap || []).forEach(d => { kidsCache[d.id] = d.data ? d.data() : d; });
        if (activeKid && !kidsCache[activeKid]) activeKid = null;
        renderKidPicker();
        renderTasks();
        renderStats();
        renderChat();
        if (document.getElementById("kidsModalBg").classList.contains("open")) renderKidsModalList();
      });
    } catch (e) { console.error("kids subscription failed", e); }

    try {
      db.collection("badges").onSnapshot((snap) => {
        badgesCache = {};
        (snap.docs || snap || []).forEach(d => { badgesCache[d.id] = d.data ? d.data() : d; });
        renderStats();
        if (document.getElementById("badgesViewModalBg").classList.contains("open")) renderBadgesViewList();
        if (document.getElementById("manageBadgesModalBg").classList.contains("open")) renderManageBadgesList();
      });
    } catch (e) { console.error("badges subscription failed", e); }

    try {
      db.doc("settings/main").onSnapshot((doc) => {
        const data = doc && doc.data ? doc.data() : doc;
        parentPin = data && data.parentPin ? data.parentPin : null;
      });
    } catch (e) { console.error("settings subscription failed", e); }

    try {
      db.collection("tasks").onSnapshot((snap) => {
        tasksCache = {};
        (snap.docs || snap || []).forEach(d => { tasksCache[d.id] = d.data ? d.data() : d; });
        renderTasks();
      });
    } catch (e) { console.error("task subscription failed", e); }

    try {
      db.collection("messages").onSnapshot((snap) => {
        messagesCache = {};
        (snap.docs || snap || []).forEach(d => { messagesCache[d.id] = d.data ? d.data() : d; });
        renderChat();
      });
    } catch (e) { console.error("message subscription failed", e); }

    try {
      db.collection("stats").onSnapshot((snap) => {
        statsCache = {};
        (snap.docs || snap || []).forEach(d => {
          const data = d.data ? d.data() : d;
          const kidId = d.id.replace(/^stats_/, "");
          statsCache[kidId] = data;
        });
        renderStats();
      });
    } catch (e) { console.error("stats subscription failed", e); }

    setTimeout(async () => {
      if (Object.keys(kidsCache).length === 0) {
        try {
          for (const k of DEFAULT_KIDS) {
            await db.doc("kids/" + k.id).set({ name: k.name, emoji: k.emoji, order: k.order, createdAt: Date.now() });
          }
        } catch (e) { /* fine if another viewer already seeded */ }
      }
      if (Object.keys(badgesCache).length === 0) {
        try {
          for (const b of DEFAULT_BADGES) {
            await db.collection("badges").add({ name: b.name, emoji: b.emoji, xp: b.xp, createdAt: Date.now() });
          }
        } catch (e) { /* fine if another viewer already seeded */ }
      }
      if (Object.keys(tasksCache).length === 0) {
        try {
          await db.collection("tasks").add({ title: "Make your bed", assignedTo: "kid_yuki", xp: 10, status: "assigned", createdAt: Date.now() });
          await db.collection("tasks").add({ title: "Finish math worksheet", assignedTo: "kid_yuki", xp: 20, status: "assigned", createdAt: Date.now() + 1 });
          await db.collection("tasks").add({ title: "Practice piano 15 min", assignedTo: "kid_sora", xp: 20, status: "assigned", createdAt: Date.now() + 2 });
        } catch (e) { /* fine if another viewer already seeded */ }
      }
    }, 900);
  }

  // ================= event bindings =================
  document.getElementById("langSelect").addEventListener("change", (e) => setLang(e.target.value));
  document.getElementById("roleChildBtn").addEventListener("click", () => setRole("child"));
  document.getElementById("roleParentBtn").addEventListener("click", () => {
    if (parentUnlocked) { setRole("parent"); return; }
    // decide whether this is first-time setup or normal unlock once we know parentPin
    openPinModal(parentPin ? "enter" : "set");
  });
  document.getElementById("lockBtn").addEventListener("click", lockParentMode);
  document.getElementById("statBadgesCard").addEventListener("click", openBadgesViewModal);
  document.getElementById("statBadgesCard").addEventListener("keydown", (e) => { if (e.key === "Enter") openBadgesViewModal(); });
  document.getElementById("closeBadgesViewBtn").addEventListener("click", closeBadgesViewModal);
  document.getElementById("badgesViewModalBg").addEventListener("click", (e) => { if (e.target.id === "badgesViewModalBg") closeBadgesViewModal(); });
  document.getElementById("manageBadgesBtn").addEventListener("click", openManageBadgesModal);
  document.getElementById("closeManageBadgesBtn").addEventListener("click", closeManageBadgesModal);
  document.getElementById("manageBadgesModalBg").addEventListener("click", (e) => { if (e.target.id === "manageBadgesModalBg") closeManageBadgesModal(); });
  document.getElementById("addBadgeBtn").addEventListener("click", addBadge);
  document.getElementById("manageKidsBtn").addEventListener("click", openKidsModal);
  document.getElementById("closeKidsModalBtn").addEventListener("click", closeKidsModal);
  document.getElementById("kidsModalBg").addEventListener("click", (e) => { if (e.target.id === "kidsModalBg") closeKidsModal(); });
  document.getElementById("addKidBtn").addEventListener("click", addKid);
  document.getElementById("addTaskBtn").addEventListener("click", openTaskModal);
  document.getElementById("cancelTaskBtn").addEventListener("click", closeTaskModal);
  document.getElementById("createTaskBtn").addEventListener("click", createTask);
  document.getElementById("taskModalBg").addEventListener("click", (e) => { if (e.target.id === "taskModalBg") closeTaskModal(); });
  document.getElementById("pinModalBg").addEventListener("click", (e) => { if (e.target.id === "pinModalBg") closePinModal(); });
  document.getElementById("pinCancelBtn").addEventListener("click", closePinModal);
  document.getElementById("pinSubmitBtn").addEventListener("click", submitPin);
  document.getElementById("pinInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitPin(); });
  document.getElementById("sendBtn").addEventListener("click", handleSend);
  document.getElementById("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") handleSend(); });
  document.getElementById("voiceBtn").addEventListener("click", toggleVoice);

  init();
})();
</script>
</body>
</html>
